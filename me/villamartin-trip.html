<html lang="is">
<head>
<meta charset="utf-8">

<title>Villamartín Trip</title>
<link rel="manifest" href="manifest.json">

<style>
:root{color-scheme:light dark;--bg:light-dark(#f3f6f8,#0c1418);--ink:light-dark(#13242c,#e7eef1);--muted:light-dark(#566a74,#9db0b8);--card:light-dark(#fff,#142128);--line:light-dark(#dbe4e8,#243640);--sea:#0b4f6c;--sea2:#1d7fa6;--orange:#f28c28;--rain:#3d9be0;--good:#2f9e62}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Figtree,system-ui,sans-serif;overflow-x:clip}
a{color:light-dark(#0b5f85,#7cc8ec)}
.hero{background:linear-gradient(160deg,#0b4f6c,#08384d);color:#fff;padding:clamp(22px,4vw,44px) max(5vw,16px) 20px}
.hero h1{font:800 clamp(30px,5vw,46px)/1.05 Figtree,sans-serif;margin:0}
.hero p{margin:6px 0 0;opacity:.88}
.hero{position:relative}.langbtn{position:absolute;top:14px;right:max(5vw,16px);background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:10px;min-height:40px;min-width:48px;font:800 15px Figtree,sans-serif;cursor:pointer}
.hero h1{padding-right:60px}
.count{display:inline-block;margin-top:12px;background:var(--orange);color:#1d1205;font-weight:800;padding:4px 12px;border-radius:999px}
.days{display:flex;gap:8px;overflow-x:auto;padding:16px max(5vw,16px) 6px;scroll-snap-type:x proximity;background:linear-gradient(#08384d,#08384d) top/100% 50px no-repeat}
.day{flex:none;scroll-snap-align:start;width:86px;border:0;border-radius:14px;background:var(--card);color:var(--ink);padding:8px 6px;text-align:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12);font:inherit}
.day b{display:block;font-size:13px;color:var(--muted);font-weight:600}
.day .dt{font-weight:800;font-size:18px}
.day svg{width:34px;height:34px;display:block;margin:2px auto}
.day .t{font-size:13px;white-space:nowrap}
.day.on{background:var(--orange);color:#1d1205}.day.on b{color:#1d1205}
.day.hotel::after{content:"Hotel";display:block;font-size:11px;font-weight:800;color:var(--sea2)}
.day.on.hotel::after{color:#1d1205}
.day:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid var(--sea2);outline-offset:2px}
main{padding:12px max(5vw,16px) 40px;max-width:1100px}
.panel{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
@media(max-width:820px){.panel{grid-template-columns:minmax(0,1fr)}.wx{order:-1}}
h2{font:800 clamp(24px,3.4vw,32px)/1.15 Figtree,sans-serif;margin:8px 0 4px}
h3{font:800 20px/1.2 Figtree,sans-serif;margin:24px 0 10px}
.lead{margin:0 0 12px;font-size:17px}
.tagline{color:var(--muted);margin:0}
.wx{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.wx .big{display:flex;align-items:center;gap:12px}
.wx svg{width:64px;height:64px;flex:none}
.wx .tt{font:800 34px/1 Figtree,sans-serif;white-space:nowrap}
.wx .ph{color:var(--muted)}
.wx dl{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin:12px 0 0}
.wx dt{font-size:13px;color:var(--muted)}.wx dd{margin:0;font-weight:600}
.wx .src{font-size:13px;color:var(--muted);margin:10px 0 0}
.note{border-left:4px solid var(--orange);background:var(--card);padding:10px 14px;border-radius:0 12px 12px 0;margin:10px 0}
.note.rain{border-color:var(--rain)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.num{width:30px;height:30px;border-radius:50%;background:var(--sea);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
.item.plan .num{background:var(--orange);color:#1d1205}
.item h4{margin:0;font-size:17px;line-height:1.3}
.item p{margin:4px 0 0;font-size:15px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:light-dark(#e8f1f5,#1d2f38);color:var(--ink);white-space:nowrap}
.chip.in{background:light-dark(#e3effb,#183049);color:light-dark(#18578e,#9fcdf5)}
.chip.planned{background:var(--orange);color:#1d1205}
.chip.warn{background:light-dark(#fdeee0,#3a2611);color:light-dark(#8a4a0c,#f5b87a)}
.links{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:15px;font-weight:600}
.links button{font:600 15px Figtree,sans-serif;background:none;border:0;padding:0;color:var(--muted);cursor:pointer;text-decoration:underline}
.btn{font:600 16px Figtree,sans-serif;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.main{background:var(--sea);border-color:var(--sea);color:#fff}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
select{font:16px Figtree,sans-serif;min-height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.hotels{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.hcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.hcard h4{margin:0 0 4px}
.hcard p{margin:4px 0;font-size:15px}
.small{font-size:13px;color:var(--muted)}
footer{border-top:1px solid var(--line);margin-top:32px;padding-top:12px}
footer li{margin:2px 0}
.filters{display:flex;flex-direction:column;gap:6px;margin:4px 0 12px}
.frow{display:flex;flex-wrap:wrap;gap:6px}
.fchip{font:600 14px Figtree,sans-serif;min-height:38px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.fchip.on{background:var(--sea);border-color:var(--sea);color:#fff}
.fchip.st.on{background:#f5b324;border-color:#f5b324;color:#1d1205}
.stars{display:flex;gap:0;margin:4px 0 0 -6px}
.stars button{background:none;border:0;padding:0;width:38px;height:38px;font-size:26px;line-height:1;color:light-dark(#c9d5db,#33464f);cursor:pointer}
.stars button.on{color:#f5b324}
.empty{color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:14px;margin:0}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>

 {n:'Search: Valencia old town under €120',c:'Booking.com',t:'2 adults, Fri 27 – Sun 29 Nov, filtered to €120 a night.',u:'https://www.booking.com/searchresults.html?ss=Ciutat+Vella%2C+Valencia&checkin=2026-11-27&checkout=2026-11-29&group_adults=2&no_rooms=1&nflt=price%3DEUR-min-120-1'},
 {n:'Granada instead? Hotel Macià Plaza / Eurostars Gran Vía',c:'Granada centre',t:'Both are near Plaza Nueva at mid-range prices. Granada forecast: rain on Sat 28, and the drive is about 3.5 h. Only worth it if you can get Alhambra tickets.',u:'https://www.trip.com/hotels/granada-plaza-nueva/hotels-c717m6788030/'}
];

/* ---------- helpers ---------- */
const DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const dObj=s=>new Date(s+'T12:00:00');
const wd=s=>dObj(s).getDay();
const fmt=s=>{const d=dObj(s);return LANG==='is'?DN_IS[d.getDay()]+' '+d.getDate()+'. '+MON_IS[d.getMonth()]:DN[d.getDay()]+' '+d.getDate()+' '+d.toLocaleString('en',{month:'short'})};
function kindFromCode(c){if(c==null)return'cloud';if(c<=1)return'sun';if(c===2)return'suncloud';if(c===3)return'cloud';if(c===45||c===48)return'fog';if(c>=95)return'thunder';if((c>=71&&c<=77)||c===85||c===86)return'snow';if(c>=51)return'rain';return'cloud'}
function icon(k){
 const C='<path d="M18 46h30a10 10 0 0 0 0-20a14 14 0 0 0-26-4a11 11 0 0 0-4 24z" fill="#b9c8d2"/>';
 const S=(x,y,r)=>{let d='';for(let a=0;a<8;a++){const t=a*Math.PI/4;d+=`M${(x+Math.cos(t)*(r+4)).toFixed(1)} ${(y+Math.sin(t)*(r+4)).toFixed(1)}L${(x+Math.cos(t)*(r+9)).toFixed(1)} ${(y+Math.sin(t)*(r+9)).toFixed(1)}`}return `<path d="${d}" stroke="#f5b324" stroke-width="3" stroke-linecap="round"/><circle cx="${x}" cy="${y}" r="${r}" fill="#f5b324"/>`};
 let s='';
 if(k==='sun')s=S(32,32,12);else if(k==='suncloud')s=S(24,22,9)+C;else if(k==='fog')s='<path d="M12 24h40M8 34h48M14 44h36" stroke="#b9c8d2" stroke-width="5" stroke-linecap="round"/>';
 else{s=C;if(k==='rain')s+='<path d="M25 51l-3 7M34 51l-3 7M43 51l-3 7" stroke="#3d9be0" stroke-width="3" stroke-linecap="round"/>';if(k==='thunder')s+='<path d="M34 44l-7 10h6l-3 9 11-13h-6l3-6z" fill="#f5b324"/>';if(k==='snow')s+='<g fill="#9cc"><circle cx="24" cy="54" r="2.6"/><circle cx="33" cy="58" r="2.6"/><circle cx="42" cy="54" r="2.6"/></g>'}
 return `<svg viewBox="0 0 64 64" aria-hidden="true">${s}</svg>`;
}
function wxFor(date){
 const l=LIVE[date],s=SNAP[date];
 if(l)return{...l,src:'live'};
 if(s)return{...s,src:'snap'};
 return null;
}
let adds={};try{adds=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
const saveAdds=()=>{try{localStorage.setItem(KEY,JSON.stringify(adds))}catch(e){}};
const isOpen=(x,date)=>!x.open||x.open.includes(wd(date));
/* ---------- stars & filters (saved on this phone) ---------- */
const SKEY='villamartin-trip-stars',FKEY='villamartin-trip-filter';
let stars={};try{stars=JSON.parse(localStorage.getItem(SKEY))||{}}catch(e){}
const saveStars=()=>{try{localStorage.setItem(SKEY,JSON.stringify(stars))}catch(e){}};
let F={types:[],min:0,sort:'dist'};try{F={...F,...(JSON.parse(localStorage.getItem(FKEY))||{})}}catch(e){}
const saveF=()=>{try{localStorage.setItem(FKEY,JSON.stringify(F))}catch(e){}};
/* min: 0 = all, -1 = unrated, 1..5 = at least n stars */
const pass=x=>(!F.types.length||F.types.includes(x.c))&&(F.min===0||(F.min===-1?!stars[x.id]:(stars[x.id]||0)>=F.min));
function starsHtml(id){
 const v=stars[id]||0;let s='';
 for(let i=1;i<=5;i++)s+=`<button type="button" class="${i<=v?'on':''}" data-star="${id}" data-v="${i}" aria-label="${U('rate',{n:i})}" aria-pressed="${i<=v}">★</button>`;
 return `<div class="stars" role="group" aria-label="${U('starF')}">${s}</div>`;
}
function filterHtml(){
 const tc=(v,l)=>`<button type="button" class="fchip${v===''?(F.types.length?'':' on'):(F.types.includes(v)?' on':'')}" data-ft="${v}" aria-pressed="${v===''?!F.types.length:F.types.includes(v)}">${esc(l)}</button>`;
 const sc=(v,l)=>`<button type="button" class="fchip st${F.min===v?' on':''}" data-fs="${v}" aria-pressed="${F.min===v}">${l}</button>`;
 return `<div class="frow" role="group" aria-label="${U('filter')}">${tc('',U('allTypes'))}${cats.map(c=>tc(c,catN(c))).join('')}</div>
 <div class="frow" role="group" aria-label="${U('starF')}">${sc(0,U('allStars'))}${sc(1,U('rated'))}${sc(3,'★3+')}${sc(4,'★4+')}${sc(5,U('five'))}${sc(-1,U('unrated'))}</div>`;
}
function renderFilters(){const h=filterHtml();$('fPicks').innerHTML=h;$('fAll').innerHTML=h}

function ranked(day){
 const w=wxFor(day.date),wet=w&&w.p>=60,date=day.date;
 const plan=day.ids.map(id=>AI[id]);
 const added=(adds[date]||[]).map(id=>AI[id]).filter(x=>x&&!day.ids.includes(x.id));
 const areaWords=(day.area||'').toLowerCase();
 const rest=A.filter(x=>!day.ids.includes(x.id)&&!(adds[date]||[]).includes(x.id)&&isOpen(x,date)).map(x=>{
   let sc=0;
   if(areaWords.includes(x.a.toLowerCase().split(' ')[0]))sc+=40;
   if(day.hotel){sc+=x.a==='Valencia'?30:-60}else{sc+=x.d<=50?15:x.d<=90?0:-40}
   if(x.open)sc+=12;
   if(wet)sc+=x.in?18:-15;
   if(x.c==='Food'||x.c==='Markets'||x.c==='Towns'||x.c==='Culture')sc+=8;
   return{x,sc};
 }).sort((a,b)=>b.sc-a.sc).map(o=>o.x);
 return{plan,added,rest,wet};
}

let cur=0,showAll=false;
function pickToday(){
 const t=new Date();const iso=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
 const i=P.findIndex(d=>d.date===iso);return i<0?0:i;
}
function renderDays(){
 $('days').innerHTML=P.map((d,i)=>{const w=wxFor(d.date);return `<button type="button" class="day${i===cur?' on':''}${d.hotel?' hotel':''}" data-i="${i}" aria-pressed="${i===cur}"><b>${fmt(d.date).split(' ')[0]}</b><span class="dt">${dObj(d.date).getDate()}</span>${w?icon(w.k):icon('cloud')}<span class="t">${w?w.hi+'° / '+w.lo+'°':'–'}</span></button>`}).join('');
}
function itemHtml(x,n,kind,date){
 const open=x.open?U('open')+' '+x.open.map(i=>(LANG==='is'?DN_IS:DN)[i]).join(', '):'';
 const closed=!isOpen(x,date);
 return `<li class="item${kind==='plan'?' plan':''}"><span class="num">${n}</span><div><h4>${esc(nm(x))}</h4>${starsHtml(x.id)}<p>${esc(tt(x))}</p>
 <div class="meta">${kind==='plan'?`<span class="chip planned">${U('inPlan')}</span>`:''}${kind==='added'?`<span class="chip planned">${U('added')}</span>`:''}<span class="chip">${esc(catN(x.c))}</span><span class="chip">${esc(x.a)} · ~${x.d} ${U('min')}</span>${x.in?`<span class="chip in">${U('indoor')}</span>`:''}${open?`<span class="chip">${open}</span>`:''}${closed&&kind!=='all'?`<span class="chip warn">${U('closed')}</span>`:''}</div>
 <div class="links">${x.ul==='Map'?'':`<a href="${esc(x.u)}" target="_blank" rel="noopener">${U(x.ul==='Info'?'info':'website')}</a>`}<a href="${esc(map(x.q))}" target="_blank" rel="noopener">${U('dir')}</a>${kind==='added'?`<button type="button" data-rm="${x.id}">${U('remove')}</button>`:''}</div></div></li>`;
}
function renderDay(){
 const d=P[cur],w=wxFor(d.date),r=ranked(d);
 $('dTitle').textContent=fmt(d.date)+': '+pd(d,0,'title');
 $('dArea').textContent=pd(d,1,'area');
 let notes=`<p class="lead">${esc(pd(d,2,'lead'))}</p>`;
 if(d.hotel)notes+=`<div class="note">${U('hotelNight',{c:esc(d.hotel)})}</div>`;
 if(r.wet)notes+=`<div class="note rain">${U('rainLikely',{p:w.p})}</div>`;
 $('dNotes').innerHTML=notes;
 const all=[...r.plan.map(x=>[x,'plan']),...r.added.map(x=>[x,'added']),...r.rest.map(x=>[x,'rest'])].filter(([x])=>pass(x)).slice(0,50);
 const shown=showAll?all:all.slice(0,10);
 $('picksTitle').textContent=showAll?U('allSug',{n:all.length}):U('top10');
 $('picks').innerHTML=shown.length?shown.map(([x,k],i)=>itemHtml(x,i+1,k,d.date)).join(''):`<li class="empty">${U('none')}</li>`;
 $('moreBtn').hidden=all.length<=10;
 $('moreBtn').textContent=showAll?U('showTop'):U('showAll',{n:all.length});
 const inDay=new Set([...d.ids,...(adds[d.date]||[])]);
 $('addSel').innerHTML=A.filter(x=>!inDay.has(x.id)).map(x=>`<option value="${x.id}">${esc(nm(x))} (${esc(x.a)})</option>`).join('');
 renderWx(d,w);
}
function renderWx(d,w){
 if(!w){$('wx').innerHTML=`<p class="ph">${U('noWx',{d:fmt(d.date)})}</p>`;return}
 $('wx').innerHTML=`<div class="big">${icon(w.k)}<div><div class="tt">${w.hi}° <span class="ph" style="font-size:20px">/ ${w.lo}°</span></div><div class="ph">${esc(phT(w.ph))}</div></div></div>
 <dl><div><dt>${U('rain')}</dt><dd>${w.p}%</dd></div>${w.wind!=null?`<div><dt>${U('wind')}</dt><dd>${Math.round(w.wind)} km/h</dd></div>`:''}</dl>
 <p class="src">${w.src==='live'?U('live'):U('snap')+(d.hotel||d.date==='2026-11-29'?U('snapV'):'')}</p>`;
}
function renderAll(){
 const list=A.filter(pass).sort((a,b)=>F.sort==='stars'?((stars[b.id]||0)-(stars[a.id]||0))||a.d-b.d:a.d-b.d);
 $('all').innerHTML=list.length?list.map((x,i)=>itemHtml(x,i+1,'all',P[cur].date)).join(''):`<li class="empty">${U('none')}</li>`;
}
function renderHotels(){
 $('hotels').innerHTML=HOTELS.map((h,i)=>{const t=LANG==='is'?H_IS[i]:[h.n,h.c,h.t];return `<div class="hcard"><h4>${esc(t[0])}</h4><p class="small">${esc(t[1])}</p><p>${esc(t[2])}</p><p><a href="${esc(h.u)}" target="_blank" rel="noopener">${U('check')}</a></p></div>`}).join('')+
 `<div class="hcard"><h4>${U('whyT')}</h4><p>${U('why')}</p></div>`;
}
function renderCount(){
 const now=new Date(),start=dObj('2026-11-23'),end=dObj('2026-12-03');
 const days=Math.ceil((start-now)/864e5);
 $('count').textContent=days>1?U('toGo',{n:days}):days===1?U('toGo1'):now<=end?U('there'):U('over');
}
function sources(){
 const s=[['AccuWeather forecast via Claude connector (20 Nov)',''],['Open-Meteo live forecast','https://open-meteo.com/'],['Markets: mercadillos.org','https://mercadillos.org/en/vega-baja'],['Torrevieja market: Casas Palmeras','https://casaspalmeras.com/en/markets-on-the-costa-blanca.html?p=97'],['Murcia lights 2026: Euro Weekly News','https://euroweeklynews.com/2026/11/14/spain-looks-to-christmas-for-a-little-light-after-a-difficult-year-as-vigo-officially-lights-up-its-streets/'],['Cartagena Puerto de Culturas','https://puertodeculturas.cartagena.es/horarios_tarifas.asp?idioma=2'],['Real Casino de Murcia: spain.info','https://www.spain.info/en/activities/tourist-visit-real-casino-murcia/'],['Valencia Mercado Central: Visit Valencia','https://www.visitvalencia.com/en/what-to-do-valencia/valencian-culture/monuments-in-valencia/central-market'],['Tabarca winter boats: Alicante Turismo','https://alicanteturismo.com/en/tabarca-island/'],['Alhambra official FAQ','https://www.alhambra-patronato.es/en/visit/faq']];
 $('sources').innerHTML=s.map(([t,u])=>`<li>${u?`<a href="${u}" target="_blank" rel="noopener">${esc(t)}</a>`:esc(t)}</li>`).join('');
}
async function live(){
 try{
  const u=`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max&timezone=Europe%2FMadrid&start_date=2026-11-23&end_date=2026-12-03`;
  const r=await fetch(u);if(!r.ok)return;
  const j=await r.json(),d=j.daily;if(!d||!d.time)return;
  const PH={sun:'Sunny',suncloud:'Sun and clouds',cloud:'Cloudy',fog:'Fog',rain:'Showers',thunder:'Thunderstorms',snow:'Snow'};
  d.time.forEach((t,i)=>{if(d.temperature_2m_max[i]==null)return;const k=kindFromCode(d.weather_code[i]);
   // keep the Valencia snapshot on Valencia days; live data is for Villamartín
   if(P.find(p=>p.date===t&&(p.hotel||t==='2026-11-29'))&&SNAP[t])return;
   LIVE[t]={hi:Math.round(d.temperature_2m_max[i]),lo:Math.round(d.temperature_2m_min[i]),p:d.precipitation_probability_max[i]??0,wind:d.wind_speed_10m_max[i],ph:PH[k],k}});
  renderDays();renderDay();
 }catch(e){}
}

/* ---------- events ---------- */
$('days').addEventListener('click',e=>{const b=e.target.closest('.day');if(!b)return;cur=+b.dataset.i;showAll=false;renderDays();renderDay();renderAll();scrollTo({top:$('dTitle').offsetTop-80,behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'})});
$('moreBtn').addEventListener('click',()=>{showAll=!showAll;renderDay()});
$('addBtn').addEventListener('click',()=>{const id=$('addSel').value;if(!id)return;const k=P[cur].date;adds[k]=adds[k]||[];if(!adds[k].includes(id))adds[k].push(id);saveAdds();renderDay()});
$('picks').addEventListener('click',e=>{const b=e.target.closest('[data-rm]');if(!b)return;const k=P[cur].date;adds[k]=(adds[k]||[]).filter(x=>x!==b.dataset.rm);saveAdds();renderDay()});
$('sortSel').addEventListener('change',()=>{F.sort=$('sortSel').value;saveF();renderAll()});
document.addEventListener('click',e=>{
 const s=e.target.closest('[data-star]');
 if(s){const id=s.dataset.star,v=+s.dataset.v;if(stars[id]===v)delete stars[id];else stars[id]=v;saveStars();renderDay();renderAll();return}
 const t=e.target.closest('[data-ft]');
 if(t){const v=t.dataset.ft;if(!v)F.types=[];else F.types=F.types.includes(v)?F.types.filter(x=>x!==v):[...F.types,v];saveF();renderFilters();renderDay();renderAll();return}
 const m=e.target.closest('[data-fs]');
 if(m){F.min=+m.dataset.fs;saveF();renderFilters();renderDay();renderAll()}
});

const cats=[...new Set(A.map(x=>x.c))];
function statics(){
 document.documentElement.lang=LANG;
 $('hTitle').textContent=U('title');$('hSub').textContent=U('sub');$('langBtn').textContent=U('lang');
 $('days').setAttribute('aria-label',U('days'));$('addLbl').textContent=U('addLbl');$('addBtn').textContent=U('add');
 $('hotelsH').textContent=U('hotels');$('allH').textContent=U('allAct');$('footP').textContent=U('foot');$('srcH').textContent=U('sources');
 $('sortSel').setAttribute('aria-label',U('sort'));$('sortSel').innerHTML=`<option value="dist">${U('sortDist')}</option><option value="stars">${U('sortStars')}</option>`;$('sortSel').value=F.sort;
 F.types=F.types.filter(c=>cats.includes(c));renderFilters();
}
function renderAllViews(){statics();renderCount();renderDays();renderDay();renderHotels();renderAll()}
$('langBtn').addEventListener('click',()=>{LANG=LANG==='is'?'en':'is';try{localStorage.setItem('villamartin-lang',LANG)}catch(e){}renderAllViews()});
cur=pickToday();
renderAllViews();sources();live();
}
</script>
</body>
</html>
