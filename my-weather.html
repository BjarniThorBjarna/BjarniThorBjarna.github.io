<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1d3a">
<title>My weather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: modern weather app, cinematic and playful, glanceable
   IDEA: a living postcard of each home: Mediterranean coast / Icelandic harbour, under the real sky right now
   PICTURE: full-screen illustrated scene, sun moving along its real arc, animated rain/snow/stars/aurora/lightning
   COLOUR and TYPE: sky decides everything; frosted glass panels, white text; Outfit throughout
   LAYOUT: hero temp over the sky, then glass cards: measured now, hourly strip, detail tiles, 7 days */
:root{color-scheme:dark;--glass:rgba(255,255,255,.13);--glass2:rgba(255,255,255,.2);--edge:rgba(255,255,255,.24);--ink:#fff;--mute:rgba(255,255,255,.72);--accent:#ffd166}
*{box-sizing:border-box;min-width:0}
html{background:#0b1d3a}
body{margin:0;color:var(--ink);font:16px/1.5 Outfit,system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased;min-height:100vh}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:#0b1d3a}
.bg svg,.bg canvas{position:absolute;inset:0;width:100%;height:100%}
.bg svg{animation:fade .9s ease}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.18) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,0) 55%,rgba(4,10,25,.55) 100%)}
.app{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.top{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(10,20,40,.28);border:1px solid var(--edge);backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%)}
.seg button{font:500 15px Outfit,system-ui,sans-serif;min-height:44px;padding:0 16px;border:0;border-radius:999px;background:none;color:#fff;cursor:pointer;white-space:nowrap;transition:background .25s,color .25s}
.seg button[aria-pressed=true]{background:#fff;color:#0b1d3a}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hero{text-align:center;padding:clamp(28px,7vh,72px) 0 clamp(28px,8vh,90px);text-shadow:0 2px 24px rgba(0,0,0,.25)}
@media(max-width:899px) and (orientation:portrait){.hero{min-height:calc(78svh - 60px);padding-top:clamp(20px,5vh,48px)}}
.place{display:inline-flex;align-items:center;gap:6px;font-size:15px;color:var(--mute)}
.place svg{flex:none}
h1{margin:4px 0 0;font-size:clamp(26px,4.5vw,40px);font-weight:500;line-height:1.1;text-wrap:balance}
.temp{font-size:clamp(104px,26vw,190px);font-weight:200;line-height:.95;letter-spacing:-.04em;margin:6px 0 0;display:inline-flex;align-items:flex-start;justify-content:center;min-height:1em}
.temp sup{font-size:.42em;font-weight:300;margin-top:.12em;margin-left:.02em}
.cond{display:flex;align-items:center;justify-content:center;gap:10px;font-size:22px;font-weight:400}
.hl{font-size:17px;color:var(--mute);margin-top:2px}
.grid{display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"flight" "obs" "hourly" "tiles" "days";gap:16px}
@media(min-width:900px){.grid{grid-template-columns:minmax(0,5fr) minmax(0,7fr);grid-template-areas:"flight flight" "obs hourly" "days tiles";align-items:start}}
.glass{background:var(--glass);border:1px solid var(--edge);border-radius:26px;backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);box-shadow:0 12px 40px rgba(0,10,30,.18),inset 0 1px 0 rgba(255,255,255,.18);padding:18px 18px 20px}
.lbl{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--mute);margin:0 0 10px}
.lbl svg{flex:none;opacity:.85}
h2.lbl{font-size:14px}
.live{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 0 rgba(74,222,128,.6);animation:pulse 2s infinite}
.obs .row{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.obs .t{font-size:64px;font-weight:200;line-height:1}
.obs .sub{font-size:14px;color:var(--mute);margin:-4px 0 12px}
.mini{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px;flex:1 1 220px}
.mini b{display:block;font-size:18px;font-weight:500;white-space:nowrap}
.mini span{font-size:13px;color:var(--mute)}
.obs .diff{margin-top:14px;font-size:14px;color:var(--mute)}
.obs details{margin-top:8px;font-size:13px;color:var(--mute)}
.obs summary{cursor:pointer;min-height:32px;display:inline-flex;align-items:center}
.obs code{font-size:12px;overflow-wrap:anywhere}
.hours{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 6px;margin:0 -4px;scrollbar-width:none}
.hours::-webkit-scrollbar{display:none}
.hr{flex:none;scroll-snap-align:start;width:66px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;border-radius:20px;font-size:15px}
.hr.now{background:var(--glass2);border:1px solid var(--edge)}
.hr .h{font-size:13px;color:var(--mute);white-space:nowrap}
.hr .tt{font-size:19px;font-weight:500}
.hr .p{font-size:12px;color:#9bd4ff;min-height:18px}
.spark{display:block;width:100%;height:46px;margin-top:4px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:600px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{min-height:150px;display:flex;flex-direction:column;padding:16px}
.tile .v{font-size:32px;font-weight:300;line-height:1.1}
.tile .v small{font-size:16px;color:var(--mute);margin-left:3px}
.tile .s{font-size:13px;color:var(--mute);margin-top:auto;padding-top:8px}
.tile.wide,.tile.seat{grid-column:span 2}
@media(min-width:600px){.tile.seat{grid-column:auto}}
.compass{display:flex;align-items:center;gap:14px}
.compass svg{flex:none}
.uvbar{height:6px;border-radius:3px;background:linear-gradient(90deg,#4ade80,#facc15,#fb923c,#ef4444,#a855f7);position:relative;margin-top:12px}
.uvbar i{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid rgba(0,0,0,.35);transform:translate(-50%,-50%)}
.days{list-style:none;margin:0;padding:0}
.days li{display:grid;grid-template-columns:minmax(4.5em,6.5em) 32px 2.8em minmax(0,1fr) 2.8em;align-items:center;gap:10px;padding:10px 0;border-top:1px solid rgba(255,255,255,.14)}
.days li:first-child{border-top:0}
.dn{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dn small{display:block;font-weight:400;font-size:12px;color:#9bd4ff;min-height:16px}
.lo{color:var(--mute);text-align:right;white-space:nowrap}.hi{font-weight:500;white-space:nowrap}
.rng{height:6px;border-radius:3px;background:rgba(255,255,255,.18);position:relative}
.rng i{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,#7dd3fc,#fde047,#fb923c)}
.flight{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
@media(min-width:900px){.flight{grid-template-columns:minmax(0,5fr) minmax(0,7fr);align-items:center}}
.cd{display:flex;gap:10px}
.cd div{flex:1 1 0;text-align:center;background:rgba(255,255,255,.12);border:1px solid var(--edge);border-radius:18px;padding:10px 4px}
.cd b{display:block;font-size:clamp(34px,9vw,52px);font-weight:300;line-height:1.05;font-variant-numeric:tabular-nums}
.cd span{font-size:13px;color:var(--mute)}
.fstate{font-size:18px;font-weight:500;margin:0 0 10px}
.route{position:relative;height:56px;margin:4px 8px 0}
.route .ln{position:absolute;top:22px;height:3px;border-radius:2px;background:rgba(255,255,255,.3)}
.route .ln.lay{background:repeating-linear-gradient(90deg,rgba(255,255,255,.4) 0 5px,transparent 5px 10px)}
.route .done{position:absolute;top:22px;left:0;height:3px;border-radius:2px;background:linear-gradient(90deg,#ffd166,#fb923c)}
.route .stop{position:absolute;top:16px;width:15px;height:15px;margin-left:-7.5px;border-radius:50%;background:#fff;border:3px solid rgba(11,29,58,.5)}
.route .code{position:absolute;top:36px;transform:translateX(-50%);font-size:13px;font-weight:600;white-space:nowrap}
.route .plane{position:absolute;top:8px;margin-left:-15px;transition:left 1s linear;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
.legs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:10px;font-size:14px}
.legs div{background:rgba(255,255,255,.1);border-radius:14px;padding:10px 12px}
.legs b{font-weight:600}.legs small{display:block;color:var(--mute);font-size:13px}
.fnote{font-size:13px;color:var(--mute);margin-top:10px}
.fwx{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:10px}
.fwx div{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border-radius:14px;padding:8px 12px;font-size:14px}
.fwx small{display:block;color:var(--mute);font-size:12px}
@media(max-width:420px){.legs,.fwx{grid-template-columns:minmax(0,1fr)}}
.foot{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-top:18px;font-size:13px;color:var(--mute)}
.foot button{font:500 14px Outfit,system-ui,sans-serif;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--edge);background:var(--glass);color:#fff;cursor:pointer;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:inline-flex;align-items:center;gap:8px}
.err{background:rgba(255,80,110,.25);border:1px solid rgba(255,140,160,.5);padding:14px 18px;border-radius:18px;margin-bottom:16px;display:none;backdrop-filter:blur(16px)}
.note{margin:0;color:var(--mute)}
.skel{display:inline-block;width:1.4em;height:.8em;border-radius:.2em;background:rgba(255,255,255,.18);animation:blink 1.4s infinite}
/* motion */
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(74,222,128,.6)}70%{box-shadow:0 0 0 10px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
@keyframes blink{50%{opacity:.4}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
@keyframes drift2{from{transform:translateX(0)}to{transform:translateX(-240px)}}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes aur{0%,100%{transform:translateX(0) skewX(0);opacity:.55}50%{transform:translateX(-60px) skewX(-8deg);opacity:.95}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes drop{0%{transform:translateY(-4px);opacity:0}30%{opacity:1}100%{transform:translateY(6px);opacity:0}}
@keyframes glint{0%,100%{opacity:.15}50%{opacity:.8}}
@keyframes beam{0%,100%{opacity:.05}50%{opacity:.5}}
.spin{animation:spin 60s linear infinite;transform-box:fill-box;transform-origin:center}
.cloud{animation:drift linear infinite}
.wave{animation:drift2 7s linear infinite}
.sway{animation:sway 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.aur{animation:aur 9s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.glint{animation:glint 3s ease-in-out infinite}
.beam{animation:beam 4s ease-in-out infinite}
.ic .bob{animation:bob 3s ease-in-out infinite}
.ic .dr{animation:drop 1.2s linear infinite}
.ic .rays{animation:spin 18s linear infinite;transform-box:fill-box;transform-origin:center}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media(max-width:420px){.seg button{padding:0 12px;font-size:14px}.glass{padding:16px}.days li{gap:8px}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <svg id="scene" preserveAspectRatio="xMidYMax slice" viewBox="0 0 1600 1000"></svg>
  <canvas id="fx"></canvas>
  <div class="flash" id="flash"></div>
  <div class="shade"></div>
</div>

<div class="app">
  <nav class="top">
    <div class="seg" role="group" id="locSeg">
      <button type="button" data-loc="spain" aria-pressed="false"></button>
      <button type="button" data-loc="iceland" aria-pressed="false"></button>
    </div>
    <div class="seg" role="group" id="langSeg">
      <button type="button" data-lang="is" aria-pressed="false" lang="is">IS</button>
      <button type="button" data-lang="en" aria-pressed="false" lang="en">EN</button>
    </div>
  </nav>

  <header class="hero">
    <div class="place"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg><span id="place"></span></div>
    <h1 id="title">&nbsp;</h1>
    <div class="temp" id="temp"><span class="skel"></span></div>
    <div class="cond" id="cond">&nbsp;</div>
    <div class="hl" id="hl">&nbsp;</div>
  </header>

  <div class="err" id="err" role="alert"></div>

  <main class="grid">
    <section class="glass flight" style="grid-area:flight" id="flight" hidden></section>
    <section class="glass obs" style="grid-area:obs">
      <h2 class="lbl"><span class="live"></span><span data-t="measured"></span></h2>
      <div class="sub" id="obsSub"></div>
      <div id="obsBody"></div>
    </section>

    <section class="glass" style="grid-area:hourly">
      <h2 class="lbl"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span data-t="next24"></span></h2>
      <div class="hours" id="hours"></div>
      <svg class="spark" id="spark" aria-hidden="true"></svg>
    </section>

    <section style="grid-area:tiles" class="tiles" id="tiles"></section>

    <section class="glass" style="grid-area:days">
      <h2 class="lbl"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span data-t="days7"></span></h2>
      <ul class="days" id="days"></ul>
    </section>
  </main>

  <footer class="foot">
    <span id="upd"></span>
    <button id="refresh" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg><span data-t="refresh"></span></button>
  </footer>
</div>

<script>
{
const $=id=>document.getElementById(id);
const r=n=>Math.round(n);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hm=s=>s.slice(11,16);
const mins=s=>+s.slice(11,13)*60+ +s.slice(14,16);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- text ---------- */
const TXT={

  presS:p=>p<1000?'Lágþrýstingur':p>1022?'Hæð':'Eðlilegur',uvS:u=>u<3?'Lágur':u<6?'Miðlungs':u<8?'Hár':u<11?'Mjög hár':'Gífurlegur',
  rainS:p=>`${p}% líkur í dag`,gustS:g=>`Hviður ${g} m/s`,
  measured:'Mælt núna',next24:'Næstu 24 klukkustundir',days7:'Spá næstu 7 daga',refresh:'Uppfæra',now:'Núna',today:'Í dag',tomorrow:'Á morgun',
  nearest:'Næsta veðurstöð',obsLoading:'Sæki…',
  upd:t=>`Uppfært kl. ${t} · Spá frá Open-Meteo.com · uppfærist á 15 mín. fresti`,
  err:m=>`Ekki tókst að sækja veðrið (${m}). Ef þú opnaðir síðuna í forskoðun Claude-appsins skaltu sækja skrána og opna hana í Chrome, Edge eða Safari, því forskoðunin lokar á netsamband.`,

function phaseNow(){
  if(!F)return {phase:'day',sunF:.45};
  const c=F.current,n=mins(c.time),sr=mins(F.daily.sunrise[0]),ss=mins(F.daily.sunset[0]);
  const sunF=(n-sr)/(ss-sr);
  let phase=n<sr-35||n>ss+35?'night':Math.abs(n-sr)<=35?'dawn':Math.abs(n-ss)<=35?'dusk':'day';
  return {phase,sunF};
}

}

/* ---------- particles: rain, snow, stars, lightning ---------- */
const cv=$('fx'),ctx=cv.getContext&&cv.getContext('2d');
let parts=[],fxMode='none',raf=0,W=0,H=0;
function sizeCanvas(){if(!ctx)return;const d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
function setFx(){
  if(!ctx)return;
  const {kind,phase,code}=SC, k=INTENS[code]||.5, area=W*H/1e6;
  fxMode=kind==='rain'||kind==='storm'?'rain':kind==='snow'?'snow':phase==='night'&&kind!=='cloud'&&kind!=='fog'?'stars':'none';
  const n=fxMode==='rain'?r(380*k*area+40):fxMode==='snow'?r(260*k*area+30):fxMode==='stars'?r(260*area+40):0;
  parts=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H*(fxMode==='stars'?.55:1),v:fxMode==='rain'?11+Math.random()*9:.6+Math.random()*1.4,l:10+Math.random()*16,s:Math.random()*2+.6,p:Math.random()*6.28}));
  cancelAnimationFrame(raf);
  if(reduce){draw(0);return}
  const loop=t=>{draw(t);raf=requestAnimationFrame(loop)};raf=requestAnimationFrame(loop);
}
function draw(t){
  ctx.clearRect(0,0,W,H);
  if(fxMode==='rain'){ctx.strokeStyle='rgba(210,230,255,.55)';ctx.lineWidth=1.3;ctx.beginPath();
    for(const p of parts){ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.l*.25,p.y+p.l);p.y+=p.v;p.x-=p.v*.25;if(p.y>H){p.y=-20;p.x=Math.random()*W*1.2}}ctx.stroke();
    if(SC.kind==='storm'&&!reduce&&Math.random()<.003){const f=$('flash');f.style.transition='none';f.style.opacity=.55;requestAnimationFrame(()=>{f.style.transition='opacity .6s';f.style.opacity=0})}}
  else if(fxMode==='snow'){ctx.fillStyle='rgba(255,255,255,.9)';
    for(const p of parts){ctx.beginPath();ctx.arc(p.x,p.y,p.s+.6,0,6.28);ctx.fill();p.y+=p.v;p.x+=Math.sin(t/1000+p.p)*.5;if(p.y>H){p.y=-6;p.x=Math.random()*W}}}
  else if(fxMode==='stars'){for(const p of parts){const a=.35+.55*Math.abs(Math.sin(t/1400+p.p));ctx.fillStyle=`rgba(255,255,255,${a})`;ctx.fillRect(p.x,p.y,p.s*.8,p.s*.8)}}
}
addEventListener('resize',()=>{const p=innerWidth/innerHeight<.9;sizeCanvas();if(p!==PORT)scene();setFx()});

/* ---------- rendering ---------- */
function renderStatic(){
  const T=L();
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=T[e.dataset.t]);
  document.querySelectorAll('[data-loc]').forEach(b=>{b.textContent=T.locs[b.dataset.loc].btn;b.setAttribute('aria-pressed',b.dataset.loc===locKey)});
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));
  $('locSeg').setAttribute('aria-label',T.locGroup);$('langSeg').setAttribute('aria-label',T.langGroup);
  $('place').textContent=T.locs[locKey].place;

function parseMetar(m){
  const o={raw:m};
  for(const t of m.split(/\s+/)){
    let x;
    if(x=t.match(/^(\d\d)(\d\d)(\d\d)Z$/)){const n=new Date();o.time=new Date(Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),+x[1],+x[2],+x[3]));if(o.time-n>864e5)o.time.setUTCMonth(o.time.getUTCMonth()-1)}
    else if(x=t.match(/^(\d{3}|VRB)(\d{2,3})(?:G(\d{2,3}))?(KT|MPS)$/)){const f=x[4]==='KT'?0.5144:1;o.dir=x[1]==='VRB'?null:+x[1];o.ws=+x[2]*f;if(x[3])o.gust=+x[3]*f}
    else if(x=t.match(/^(M?\d{2})\/(M?\d{2})?$/)){const v=y=>+y.replace('M','-');o.t=v(x[1]);if(x[2])o.td=v(x[2])}
    else if(x=t.match(/^Q(\d{4})$/))o.q=+x[1];
    else if(x=t.match(/^A(\d{4})$/))o.q=Math.round(+x[1]/100*33.8639);
    else if(['CAVOK','NSC','SKC','CLR','NCD'].includes(t))o.clear=true;
    else if(x=t.match(/^(FEW|SCT|BKN|OVC)\d{3}/)){const k={FEW:1,SCT:2,BKN:3,OVC:4};if(!o.cl||k[x[1]]>k[o.cl])o.cl=x[1]}
    else if(x=t.match(/^([-+]?)(SH|TS)?(RA|DZ|SN|GR|FG|BR|HZ|DU|SA)$/)){o.wx=x[2]==='SH'&&x[3]==='RA'?'SHRA':x[2]==='TS'?(x[3]==='RA'?'TSRA':'TS'):x[3];o.wxInt=x[1]==='-'?'light':x[1]==='+'?'heavy':''}
    else if(t==='TS')o.wx='TS';
  }
  if(o.t!=null&&o.td!=null){const g=v=>Math.exp(17.625*v/(243.04+v));o.rh=Math.round(100*g(o.td)/g(o.t))}
  return o;
}
async function getMetar(ids){
  const res=await fetch('https://metar.vatsim.net/'+ids.join(','));
  if(!res.ok)throw new Error('HTTP '+res.status);
  const lines=(await res.text()).trim().split('\n');
  for(const id of ids){const l=lines.find(x=>x.startsWith(id+' '));if(l){const m=parseMetar(l);if(m.t!=null&&m.time&&Date.now()-m.time<3*36e5)return {type:'metar',id,m,time:m.time}}}
  return {error:'none'};
}
async function getVedur(ids){
  const res=await fetch('https://xmlweather.vedur.is/?op_w=xml&type=obs&lang=en&view=xml&params=T;F;FG;D;RH;P;R&ids='+ids.join(';'));
  if(!res.ok)throw new Error('HTTP '+res.status);
  const x=new DOMParser().parseFromString(await res.text(),'text/xml');
  const all=[...x.querySelectorAll('station')].map(n=>{const g=k=>{const v=n.querySelector(k)?.textContent.trim();return v?v:null};
    return {id:n.getAttribute('id'),name:g('name'),time:g('time'),T:g('T'),F:g('F'),FG:g('FG'),D:g('D'),RH:g('RH'),P:g('P'),R:g('R')}});
  const s=ids.map(id=>all.find(a=>a.id===id)).find(a=>a&&a.T!=null&&a.time);
  if(!s)return {error:'none'};
  const DEG={N:0,NNE:22.5,NE:45,ENE:67.5,E:90,ESE:112.5,SE:135,SSE:157.5,S:180,SSW:202.5,SW:225,WSW:247.5,W:270,WNW:292.5,NW:315,NNW:337.5};
  s.D=s.D in DEG?DEG[s.D]:null;
  s.P=s.P||all.find(a=>a.P)?.P||null;
  s.RH=s.RH||all.find(a=>a.RH)?.RH||null;
  return {type:'vedur',s,time:new Date(s.time.replace(' ','T')+'Z')};
}

  const [m,o]=await Promise.all([mar,ob]);
  if(my!==gen)return;
  M=m;O=o;renderForecast();renderObs();
}
function setLoc(k){
  locKey=k;loc=LOCS[k];gen++;F=M=O=null;errMsg=null;updated=null;
  store('loc',k);
  if(location.hash.slice(1)!==k)history.replaceState(null,'','#'+k);
  renderAll();
}
document.querySelectorAll('[data-loc]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.loc!==locKey){setLoc(b.dataset.loc);load()}}));
